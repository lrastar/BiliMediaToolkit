
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build and package
        run: npm run package

      - name: Zip release
        run: |
          cd releases
          zip -r BiliMediaToolkit.zip BiliMediaToolkit

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/BiliMediaToolkit.zip
          name: BiliMediaToolkit ${{ github.ref_name }}
          body: |
            # BiliMediaToolkit ${{ github.ref_name }}
            
            ## Release Notes
            - Initial release
            
            ## How to use
            1. Download and extract `BiliMediaToolkit.zip`
            2. Enter the extracted directory
            3. Windows: Double-click `start.bat`
            4. Linux/macOS: Run `bash start.sh`
            5. Open http://localhost:3000 in your browser
            
            ## Features
            - Support for AV1/HEVC/AVC codec selection
            - Support for Dolby Vision/HDR/4K/1080P+ quality
            - Support for Dolby Atmos/Hi-Res audio
            - Batch downloading
            - Download history
            - QR code login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

