
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build and package
        run: npm run package

      - name: Zip release
        run: |
          cd releases
          zip -r BiliMediaToolkit.zip BiliMediaToolkit

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" &gt;&gt; $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/BiliMediaToolkit.zip
          name: BiliMediaToolkit ${{ steps.get_version.outputs.VERSION }}
          body: |
            # BiliMediaToolkit ${{ steps.get_version.outputs.VERSION }}
            
            ## 更新内容
            - 自动打包发布
            
            ## 安装使用
            1. 下载并解压 `BiliMediaToolkit.zip`
            2. 进入解压目录
            3. Windows 用户：双击运行 `start.bat`
            4. Linux/macOS 用户：执行 `bash start.sh`
            5. 在浏览器打开 http://localhost:3000 即可使用
            
            ## 功能特性
            - 支持 AV1/HEVC/AVC 编码选择
            - 支持杜比视界/HDR 真彩/4K/1080P+ 等高画质
            - 支持杜比全景声/Hi-Res 无损音频
            - 批量下载
            - 历史记录
            - 扫码登录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

